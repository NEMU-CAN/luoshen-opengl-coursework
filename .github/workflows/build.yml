name: Windows build and asset checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build scene and tests
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Validate models and animation mathematics
        shell: pwsh
        run: ./scripts/check.ps1
